<svg xmlns="http://www.w3.org/2000/svg" width="460" height="334" viewBox="-10 -10 460 334" role="img" aria-label="Before/after diagram: the recorded material token carried through to the mesh builder"><style>
  text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .bg { fill: #f9f9f7; }
  .cbox { fill: #fcfcfb; stroke: rgba(11,11,11,.10); }
  .cbox-label { font-size: 11.5px; font-weight: 600; fill: #0b0b0b; }
  .cbox-note { font-size: 9.5px; fill: #898781; }
  .cedge { fill: none; }
  .cedge.plain { stroke: #898781; stroke-width: 1.4; opacity: .8; }
  .cedge.hot { stroke: #2a78d6; stroke-width: 2.4; }
  .head-plain { fill: #898781; }
  .head-hot { fill: #2a78d6; }
  .cedge-label { font-size: 9.5px; fill: #52514e; paint-order: stroke; stroke: #f9f9f7; stroke-width: 3px; }
</style><rect class="bg" x="-10" y="-10" width="460" height="334" rx="8"/><defs><marker id="arrp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="head-plain"/></marker><marker id="arrh" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="head-hot"/></marker></defs><path d="M220.0,48.0 C220.0,66.0 220.0,74.0 220.0,92.0" class="cedge plain" marker-end="url(#arrp)"/><path d="M220.0,132.0 C220.0,150.0 220.0,242.0 220.0,260.0" class="cedge hot" marker-end="url(#arrh)"/><path d="M220.0,216.0 C220.0,234.0 220.0,242.0 220.0,260.0" class="cedge plain" marker-end="url(#arrp)"/><rect x="90.0" y="8" width="260.0" height="40" rx="6" class="cbox"/><text x="220.0" y="25" text-anchor="middle" class="cbox-label">MazeRenderer.emitDoor / emitWindow</text><text x="220.0" y="41" text-anchor="middle" class="cbox-note">resolves mat= from the true edge</text><rect x="79.5" y="92" width="281.0" height="40" rx="6" class="cbox"/><text x="220.0" y="109" text-anchor="middle" class="cbox-label">trace line  door coord=2,5 mat=beatup</text><text x="220.0" y="125" text-anchor="middle" class="cbox-note">unchanged — no snapshot churn</text><rect x="114.5" y="176" width="211.0" height="40" rx="6" class="cbox"/><text x="220.0" y="193" text-anchor="middle" class="cbox-label">SpawnerLogParsers.parseEdge</text><text x="220.0" y="209" text-anchor="middle" class="cbox-note">still reconstructs the coord — narrowed to positioning only</text><rect x="69.0" y="260" width="302.0" height="40" rx="6" class="cbox"/><text x="220.0" y="277" text-anchor="middle" class="cbox-label">buildDoorwayWall(edge, bottom, material)</text><text x="220.0" y="293" text-anchor="middle" class="cbox-note">uses the recorded material, like the polygon path already does</text><text x="220.0" y="70.0" text-anchor="middle" class="cedge-label">record</text><text x="220.0" y="196.0" text-anchor="middle" class="cedge-label">mat= carried through</text><text x="220.0" y="238.0" text-anchor="middle" class="cedge-label">edge (position only)</text></svg>
